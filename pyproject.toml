[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "txtlvit"
version = "0.4.0"
description = "A Python CLI for common text processing tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
txtool = "txtool.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["txtool*"]
